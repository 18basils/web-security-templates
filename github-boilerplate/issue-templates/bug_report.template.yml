name: "🐛 Bug Report"
description: "File a bug report to help us improve the software"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to fill out this bug report!"

  - type: textarea
    id: description
    attributes:
      label: "Describe the Bug"
      description: "A clear and concise description of what the bug is."
      placeholder: "When clicking the hydration reminder button..."
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: "Platform / Operating System"
      description: "Which platform did this occur on?"
      options:
        - "Windows 11"
        - "Windows 10"
        - "macOS (Apple Silicon M-Series)"
        - "macOS (Intel)"
        - "Android"
        - "iOS / iPadOS"
        - "Web Portal"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Exact steps to reproduce the issue."
      placeholder: "1. Launch app\n2. Open settings\n3. Select avatar..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Logs or Screenshots"
      description: "Paste relevant error traces or drag & drop screenshots here."
