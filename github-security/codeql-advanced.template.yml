# ==============================================================================
# CODEQL ADVANCED SETUP WORKFLOW TEMPLATE (.github/workflows/codeql.yml)
# ==============================================================================
# Use this workflow when:
# 1. CodeQL Default Setup fails because compiled code lives in a subdirectory
# 2. You need custom build flags or specific Xcode schemes / Gradle tasks
# ==============================================================================

name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '30 4 * * 1' # Runs every Monday at 04:30 UTC

# Explicit least-privilege permissions (Prevents CWE-275 CodeQL alert)
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          # Python / JavaScript / Actions (No build steps required)
          - language: python
            build-mode: none

          - language: actions
            build-mode: none

          # Compiled Languages (Specify manual build steps below)
          # - language: java-kotlin
          #   build-mode: manual

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    # Manual build step for compiled languages (Uncomment and customize if needed)
    # - name: Build Android Java/Kotlin
    #   if: matrix.language == 'java-kotlin'
    #   run: |
    #     cd phone-companion
    #     ./gradlew assembleDebug

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
