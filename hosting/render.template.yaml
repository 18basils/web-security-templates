# ==============================================================================
# RENDER STATIC SITE BLUEPRINT TEMPLATE (render.yaml)
# ==============================================================================
services:
  - type: web
    name: static-web-app
    env: static
    buildCommand: "" # e.g. npm run build if using a build framework, or empty for static HTML
    staticPublishPath: ./public # Adjust to your build output directory
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-XSS-Protection
        value: "0"
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()
      - path: /*
        name: Content-Security-Policy
        value: default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;
      - path: /*.webmanifest
        name: Content-Type
        value: application/manifest+json; charset=utf-8
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /sw.js
        name: Content-Type
        value: application/javascript; charset=utf-8
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /downloads/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /downloads/*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive, nosnippet
      - path: /downloads/*
        name: Content-Disposition
        value: attachment
