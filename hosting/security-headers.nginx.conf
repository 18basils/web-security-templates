# ==============================================================================
# NGINX SECURITY & ABUSE PREVENTION SNIPPET
# Include inside your `server { ... }` block
# ==============================================================================
# NOTE ON NGINX HEADER INHERITANCE:
# Nginx drops `server`-level `add_header` directives inside any `location` block
# that defines its own `add_header`. Therefore, every `location` block below that
# sets custom headers also explicitly includes the 8 core security headers so
# `/` (`/index.html`), `/sw.js`, `/assets/`, and `/downloads/` retain A+ headers.
# ==============================================================================

# 1. HTTP Strict Transport Security (HSTS)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# 2. Prevent MIME-Type Sniffing
add_header X-Content-Type-Options "nosniff" always;

# 3. Prevent Clickjacking (framing)
add_header X-Frame-Options "DENY" always;

# 4. Disable Legacy XSS Auditor (OWASP / MDN recommendation when CSP is active)
add_header X-XSS-Protection "0" always;

# 5. Referrer Privacy Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 6. Cross-Origin Window Isolation
add_header Cross-Origin-Opener-Policy "same-origin" always;

# 7. Restrict Sensitive Device Hardware & Permissions
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()" always;

# 8. Content Security Policy (Clean Baseline - extend via AGENT_RECIPES.md as needed)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;

# 9. Web Manifest MIME Type (No add_header used -> inherits server-level headers)
location ~* \.webmanifest$ {
    types { } default_type "application/manifest+json; charset=utf-8";
}

# 10. Service Worker & HTML Cache Controls (Preserves all 8 core security headers)
location = /sw.js {
    default_type "application/javascript; charset=utf-8";
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;
}

location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;
}

# 11. Immutable Static Hashed Assets (Preserves all 8 core security headers)
location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;
}

# 12. Binary Downloads Protection & Rate-Limiting / Noindex
location ^~ /downloads/ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header Content-Disposition "attachment" always;
    add_header Cache-Control "public, max-age=86400" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;
}

# 13. Block Direct Access to Hidden / Sensitive Files & Directories (.git, .env)
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}
